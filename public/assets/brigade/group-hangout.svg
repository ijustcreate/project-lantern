<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" role="img" aria-labelledby="title">
  <title id="title">Three child-drawn toy soldiers hanging out together</title>
  <style>
    .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: gentle-sway 4.2s ease-in-out infinite; }
    .sway.middle { animation-delay: -.9s; }
    .sway.yellow { animation-delay: -1.8s; }
    .arm { transform-box: fill-box; transform-origin: 50% 0%; }
    .red .arm, .middle .arm { animation: arm-lift 3.8s ease-in-out infinite; }
    .yellow .arm.left { animation: arm-lift 3.8s ease-in-out infinite; }
    .yellow .arm.right { animation: wave 2.25s ease-in-out infinite; }
    @keyframes gentle-sway { 0%, 100% { transform: rotate(-1.4deg) translateY(1px); } 50% { transform: rotate(1.4deg) translateY(-1px); } }
    @keyframes arm-lift { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
    @keyframes wave { 0%, 100% { transform: rotate(0deg); } 32% { transform: rotate(-22deg); } 55% { transform: rotate(-12deg); } 76% { transform: rotate(-22deg); } }
    @media (prefers-reduced-motion: reduce) { .sway, .arm { animation: none; } }
  </style>
  <path d="M22 268c132 9 329-7 496 3" fill="none" stroke="#173f61" stroke-width="7" stroke-linecap="round" opacity=".35"/>
  <defs>
    <g id="toy-soldier">
      <path d="M48 48c8-24 69-32 83 2l-3 37H52z" fill="var(--uniform)" stroke="#173f61" stroke-width="7" stroke-linejoin="round"/>
      <path d="M46 75c30-6 60-5 89 2" fill="none" stroke="var(--trim)" stroke-width="8" stroke-linecap="round"/>
      <path d="M62 83c-1 36 11 50 30 51 22 0 32-18 29-51" fill="#efb58b" stroke="#173f61" stroke-width="7"/>
      <circle cx="77" cy="102" r="4" fill="#173f61"/><circle cx="105" cy="102" r="4" fill="#173f61"/><path d="M80 120c8 5 16 5 24 0" fill="none" stroke="#173f61" stroke-width="5" stroke-linecap="round"/>
      <g class="arm left"><path d="M48 144l-25 51 17 8 29-45" fill="var(--arms)" stroke="#173f61" stroke-width="7" stroke-linejoin="round"/></g><g class="arm right"><path d="M124 145l28 49-17 10-29-46" fill="var(--arms)" stroke="#173f61" stroke-width="7" stroke-linejoin="round"/></g>
      <path d="M59 137l62-1 15 73-91 1z" fill="var(--uniform)" stroke="#173f61" stroke-width="7" stroke-linejoin="round"/>
      <path d="M90 139l1 68M65 158l52 1M69 178l43 2" fill="none" stroke="var(--trim)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="91" cy="151" r="4" fill="#173f61"/><circle cx="91" cy="171" r="4" fill="#173f61"/>
      <path d="M63 211l-9 67 23 1 14-57 12 57 24-1-10-68" fill="var(--legs)" stroke="#173f61" stroke-width="7" stroke-linejoin="round"/>
      <path d="M48 279l30 1M102 279l28-1" fill="none" stroke="#173f61" stroke-width="9" stroke-linecap="round"/>
    </g>
  </defs>
  <g transform="translate(28 42) rotate(-5 65 105) scale(.72)" style="--uniform:#c74b3d;--trim:#f4c45d;--arms:#267da7;--legs:#267da7"><g class="sway red"><use href="#toy-soldier"/></g></g>
  <g transform="translate(190 20) rotate(2 65 105) scale(.79)" style="--uniform:#2485b5;--trim:#f4c45d;--arms:#c74b3d;--legs:#c74b3d"><g class="sway middle"><use href="#toy-soldier"/></g></g>
  <g transform="translate(371 41) rotate(5 65 105) scale(.72)" style="--uniform:#f3c64f;--trim:#c74b3d;--arms:#267da7;--legs:#267da7"><g class="sway yellow"><use href="#toy-soldier"/></g></g>
  <path d="M161 89c18-13 30-15 43-2M348 81c16-12 29-12 41 1" fill="none" stroke="#c74b3d" stroke-width="5" stroke-linecap="round" stroke-dasharray="5 8"/>
</svg>
