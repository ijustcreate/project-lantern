<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050608">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WallTrace Mobile</title>
<style>
:root{color-scheme:dark;--a:#d6ff34;--bg:#050608;--p:#0b0d11ee;--line:#ffffff25;--m:#aeb4bf}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:white}button,input{font:inherit}.app{position:fixed;inset:0;background:#050608;overflow:hidden;touch-action:none}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.art{position:absolute;left:50%;top:50%;width:280px;height:280px;transform-origin:center;display:none;touch-action:none}.art img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}.art:after{content:"";position:absolute;inset:-4px;border:1.5px dashed var(--a);border-radius:5px;pointer-events:none}.art.locked:after{border-style:solid;opacity:.5}.top{position:absolute;z-index:20;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:none}.brand,.status{pointer-events:auto;background:#090b0edd;border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:17px}.brand{padding:10px 12px;display:flex;align-items:center;gap:9px;font-weight:800}.logo{width:21px;height:21px;border:3px solid var(--a);border-radius:7px 14px 7px 14px;transform:rotate(8deg)}.status{margin-left:auto;padding:9px 11px;font-size:11px;max-width:56vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.welcome{position:absolute;z-index:18;left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,calc(100% - 28px));padding:20px;background:#090b0ef2;border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}.welcome.hide{display:none}.welcome h1{margin:0 0 7px;font-size:30px;letter-spacing:-1px}.welcome p{margin:0 0 14px;color:#bcc1ca;line-height:1.45;font-size:14px}.row{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#ffffff0e;color:white;border-radius:15px;min-height:50px;padding:10px 14px;font-weight:750}.btn.primary{background:var(--a);color:#111407;border-color:transparent}.btn.flex{flex:1}.notice{font-size:12px;line-height:1.4;color:#abb1bc;background:#ffffff0a;border-radius:13px;padding:10px;margin-top:10px}.toolbar{position:absolute;z-index:25;left:9px;right:9px;bottom:max(9px,env(safe-area-inset-bottom));height:78px;border:1px solid var(--line);background:#090b0eed;border-radius:24px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(5,1fr);padding:7px;gap:4px}.tool{border:0;background:transparent;color:#c3c8d0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px}.tool b{font-size:22px;line-height:22px}.tool.active{background:#ffffff12;color:var(--a)}.tool.primary{background:var(--a);color:#111407;font-weight:800}.panel{position:absolute;z-index:30;left:10px;right:10px;bottom:96px;padding:16px;background:#0b0d11f5;border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);display:none}.panel.open{display:block}.panel h2{margin:0 0 5px;font-size:19px}.panel p{margin:0 0 12px;font-size:12px;color:var(--m)}.control{display:grid;grid-template-columns:72px 1fr 48px;align-items:center;gap:8px;margin:12px 0;font-size:12px}.control input{width:100%;accent-color:var(--a)}.hidden{display:none!important}.grid{position:absolute;inset:0;display:none;pointer-events:none;background-image:linear-gradient(#fff2 1px,transparent 1px),linear-gradient(90deg,#fff2 1px,transparent 1px);background-size:12.5vw 12.5vw}.grid.on{display:block}.chip{border:1px solid var(--line);background:#ffffff0b;color:white;border-radius:999px;padding:9px 11px}.error{display:none;margin-top:10px;padding:10px;background:#ff505016;border:1px solid #ff6e6e3d;border-radius:12px;font:11px/1.4 ui-monospace,monospace;white-space:pre-wrap}.error.on{display:block}
</style>
</head>
<body>
<main class="app">
<video id="camera" autoplay muted playsinline></video><div id="grid" class="grid"></div><div id="artLayer" class="art"><img id="artImage" alt="Tracing reference"></div>
<header class="top"><div class="brand"><span class="logo"></span><span>WallTrace</span></div><div class="status" id="status">Camera not started</div></header>
<section class="welcome" id="welcome"><h1>Trace art onto reality.</h1><p>Start the rear camera, choose an image from Photos, position it over the wall or canvas, then lock it while you trace.</p><div class="row"><button class="btn primary flex" id="start">Start camera</button><button class="btn flex" id="pickWelcome">Add art</button></div><div class="notice" id="runtime">Checking camera support…</div><div class="error" id="error"></div></section>
<nav class="toolbar"><button class="tool primary" id="pick"><b>＋</b><span>Art</span></button><button class="tool" id="lock"><b>🔓</b><span>Lock</span></button><button class="tool" id="trace"><b>◐</b><span>Trace</span></button><button class="tool" id="reset"><b>↺</b><span>Reset</span></button><button class="tool" id="gridBtn"><b>▦</b><span>Grid</span></button></nav>
<input id="file" class="hidden" type="file" accept="image/*">
<section class="panel" id="panel"><h2>Tracing</h2><p>Lower opacity until you can see the physical surface beneath the reference.</p><div class="control"><label>Opacity</label><input id="opacity" type="range" min="0.05" max="1" step="0.01" value="0.55"><span id="opv">55%</span></div><div class="control"><label>Scale</label><input id="scale" type="range" min="0.08" max="5" step="0.01" value="1"><span id="scv">1.00</span></div><div class="control"><label>Rotate</label><input id="rotation" type="range" min="-180" max="180" step="1" value="0"><span id="rv">0°</span></div></section>
</main>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),camera=$('#camera'),artLayer=$('#artLayer'),artImage=$('#artImage'),welcome=$('#welcome'),status=$('#status'),runtime=$('#runtime'),error=$('#error'),file=$('#file');const S={stream:null,x:innerWidth/2,y:innerHeight/2,scale:1,rot:0,opacity:.55,locked:false,w:280,h:280,pointers:new Map(),gesture:null};const say=t=>status.textContent=t;function fail(t){error.textContent=t;error.classList.add('on')}function support(){if(!window.isSecureContext){runtime.innerHTML='<b>HTTPS required.</b>';say('HTTPS required');return false}if(!navigator.mediaDevices?.getUserMedia){runtime.innerHTML='<b>Camera API unavailable.</b> Open this page directly in Safari.';say('Open in Safari');return false}runtime.textContent='Camera API detected. Tap Start camera and choose Allow.';say('Ready · camera permission needed');return true}async function startCamera(){error.classList.remove('on');if(!support())return;try{say('Requesting rear camera…');const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});S.stream=stream;camera.srcObject=stream;await camera.play();welcome.classList.add('hide');say('Camera live · add art')}catch(e){const n=e?.name||e?.message||String(e);say('Camera failed · '+n);fail('Camera error: '+n+'\n\nIf permission was denied, Safari → aA/page menu → Website Settings → Camera → Allow, then reload.')}}function apply(){artLayer.style.width=S.w+'px';artLayer.style.height=S.h+'px';artLayer.style.opacity=S.opacity;artLayer.style.transform=`translate(-50%,-50%) translate(${S.x-innerWidth/2}px,${S.y-innerHeight/2}px) rotate(${S.rot}deg) scale(${S.scale})`;$('#opacity').value=S.opacity;$('#opv').textContent=Math.round(S.opacity*100)+'%';$('#scale').value=S.scale;$('#scv').textContent=S.scale.toFixed(2);$('#rotation').value=S.rot;$('#rv').textContent=Math.round(S.rot)+'°';$('#lock').innerHTML='<b>'+(S.locked?'🔒':'🔓')+'</b><span>Lock</span>';$('#lock').classList.toggle('active',S.locked);artLayer.classList.toggle('locked',S.locked)}function choose(){file.click()}function load(f){if(!f)return;const u=URL.createObjectURL(f);artImage.onload=()=>{const r=artImage.naturalWidth/artImage.naturalHeight;let w=Math.min(innerWidth*.74,430),h=w/r;if(h>innerHeight*.58){h=innerHeight*.58;w=h*r}S.w=w;S.h=h;S.x=innerWidth/2;S.y=innerHeight/2;S.scale=1;S.rot=0;artLayer.style.display='block';apply();welcome.classList.add('hide');say(S.stream?'Camera live · art loaded':'Art loaded · start camera');URL.revokeObjectURL(u)};artImage.src=u}$('#start').onclick=startCamera;$('#pick').onclick=choose;$('#pickWelcome').onclick=choose;file.onchange=()=>{load(file.files?.[0]);file.value=''};$('#lock').onclick=()=>{S.locked=!S.locked;apply();say(S.locked?'Placement locked':'Placement unlocked')};$('#trace').onclick=()=>$('#panel').classList.toggle('open');$('#gridBtn').onclick=()=>{$('#grid').classList.toggle('on');$('#gridBtn').classList.toggle('active')};$('#reset').onclick=()=>{S.x=innerWidth/2;S.y=innerHeight/2;S.scale=1;S.rot=0;S.opacity=.55;apply()};$('#opacity').oninput=e=>{S.opacity=+e.target.value;apply()};$('#scale').oninput=e=>{S.scale=+e.target.value;apply()};$('#rotation').oninput=e=>{S.rot=+e.target.value;apply()};artLayer.addEventListener('pointerdown',e=>{if(S.locked)return;e.preventDefault();artLayer.setPointerCapture?.(e.pointerId);S.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const a=[...S.pointers.values()];if(a.length===1)S.gesture={x:S.x,y:S.y,p:a[0]};if(a.length===2){const dx=a[1].x-a[0].x,dy=a[1].y-a[0].y;S.gesture={x:S.x,y:S.y,scale:S.scale,rot:S.rot,dist:Math.hypot(dx,dy),ang:Math.atan2(dy,dx)}}});artLayer.addEventListener('pointermove',e=>{if(S.locked||!S.pointers.has(e.pointerId))return;e.preventDefault();S.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const a=[...S.pointers.values()];if(a.length===1&&S.gesture?.p){S.x=S.gesture.x+a[0].x-S.gesture.p.x;S.y=S.gesture.y+a[0].y-S.gesture.p.y;apply()}else if(a.length===2&&S.gesture){const dx=a[1].x-a[0].x,dy=a[1].y-a[0].y;S.scale=Math.max(.05,Math.min(8,S.gesture.scale*Math.hypot(dx,dy)/S.gesture.dist));S.rot=S.gesture.rot+(Math.atan2(dy,dx)-S.gesture.ang)*180/Math.PI;apply()}});function up(e){S.pointers.delete(e.pointerId);S.gesture=null;if(S.pointers.size===1){const p=[...S.pointers.values()][0];S.gesture={x:S.x,y:S.y,p:{...p}}}}artLayer.addEventListener('pointerup',up);artLayer.addEventListener('pointercancel',up);window.addEventListener('resize',()=>{S.x=Math.min(innerWidth,Math.max(0,S.x));S.y=Math.min(innerHeight,Math.max(0,S.y));apply()});support();apply()})();
</script>
</body></html>
