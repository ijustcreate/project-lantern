[package]
name = "project-lantern"
version = "0.1.0"
description = "Project Lantern recognition display host"
authors = ["Project Lantern"]
edition = "2021"

[lib]
name = "project_lantern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
base64 = "0.22"
