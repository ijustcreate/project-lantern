<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12334c" />
    <title>Project Lantern has moved</title>
    <style>
      :root { color: #eef7ff; background: #071827; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(36rem, calc(100% - 3rem)); padding: 2.5rem; border: 1px solid #8dcae0; border-radius: 1rem; background: #0e2b40; text-align: center; box-shadow: 0 1rem 4rem #0008; }
      h1 { margin: 0 0 .7rem; font-size: clamp(1.8rem, 5vw, 2.7rem); }
      p { margin: 0 0 1.6rem; color: #c7e0ef; line-height: 1.55; }
      a { display: inline-block; padding: .85rem 1.2rem; border-radius: .6rem; color: #04202b; background: #8ed7dc; font-weight: 800; text-decoration: none; }
      a:hover, a:focus-visible { background: #c5f2ec; outline: 3px solid white; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Project Lantern has moved</h1>
      <p>The live recognition-board site is now hosted as Toy Soldier Brigade.</p>
      <a href="https://ijustcreate.github.io/toysoldierbrigade/">Open Toy Soldier Brigade</a>
    </main>
  </body>
</html>
